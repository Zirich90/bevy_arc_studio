[package]
name = "bevy_arc_pf2e"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pathfinder 2e rules, actors and tactical encounters plugin for Bevy ArcStudio"

[dependencies]
bevy = { version = "0.20.0", features = ["bevy_remote"] }
bevy_egui = "0.43.1"
bevy_arc_studio = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
rand = "0.8"
